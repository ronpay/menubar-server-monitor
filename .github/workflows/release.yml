name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into build script
        run: |
          sed -i '' "s/^VERSION=.*/VERSION=\"${{ steps.version.outputs.version }}\"/" scripts/build-app.sh
          sed -i '' "s/^BUILD=.*/BUILD=\"${GITHUB_RUN_NUMBER}\"/" scripts/build-app.sh

      - name: Build .app
        run: ./scripts/build-app.sh release

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package DMG
        run: |
          mkdir -p dist
          create-dmg \
            --volname "ServerMonitor ${{ steps.version.outputs.version }}" \
            --window-size 540 360 \
            --icon-size 96 \
            --icon "ServerMonitor.app" 140 180 \
            --app-drop-link 400 180 \
            --no-internet-enable \
            "dist/ServerMonitor-${{ steps.version.outputs.version }}.dmg" \
            "build/ServerMonitor.app"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ServerMonitor-${{ steps.version.outputs.version }}.dmg
          generate_release_notes: true
